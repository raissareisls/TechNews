<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171f1b">
  <title>TechNews | Artigos de tecnologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="shell top">
      <a class="brand" href="./"><span aria-hidden="true">›_</span> TechNews</a>
      <nav aria-label="Seções">
        <button type="button" data-view="feed" aria-pressed="true">Feed</button>
        <button type="button" data-view="saved" aria-pressed="false">Salvos <span id="saved-count"></span></button>
      </nav>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="heading">
      <p class="source"><span></span> DEV Community</p>
      <h1 id="heading">Tecnologia em pauta<span>.</span></h1>
      <p id="subtitle">Artigos de programação escritos pela comunidade.</p>
    </section>
    <section aria-label="Artigos">
      <div id="articles"></div>
      <div class="pagination">
        <p id="status" role="status"></p>
        <button type="button" id="load-more" class="pill" hidden>Carregar mais artigos</button>
      </div>
    </section>
  </main>
  <footer class="shell footer"><strong>TechNews</strong><a href="https://dev.to/">DEV Community</a></footer>
  <dialog id="reader" aria-labelledby="reader-title">
    <div class="reader-bar"><span>Leitura</span><form method="dialog"><button class="pill">Fechar</button></form></div>
    <div class="reader-content">
      <h2 id="reader-title"></h2>
      <p id="reader-author"></p>
      <p id="reader-status" role="status"></p>
      <div id="reader-body"></div>
      <a id="reader-link" target="_blank" rel="noopener noreferrer">Abrir artigo no DEV ↗</a>
    </div>
  </dialog>
</body>
</html>
