<text x="44" y="131" font-size="29" font-weight="700">What happens when</text><text x="44" y="164" font-size="29" font-weight="700">you await a Promise?</text>
<text x="44" y="199" class="muted">Alex Morgan</text>
<text x="44" y="239">An async function pauses at await and</text><text x="44" y="263">resumes when the promise settles. While</text><text x="44" y="287">it waits, the browser can respond to input</text><text x="44" y="311">and run other tasks.</text><text x="44" y="355" class="action">Abrir no DEV</text>
  
